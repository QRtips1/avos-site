<script>
const PAGE_TITLE = "t_admin", PREFIX = "../";

let TAB = "kalendar";
const signed = () => { try { return sessionStorage.getItem("limo-admin") === "1"; } catch (e) { return false; } };
function show(){ $("#login").hidden = signed(); $("#app").hidden = !signed(); $("#logout").hidden = !signed(); }
$("#login").addEventListener("submit", e => { e.preventDefault(); try { sessionStorage.setItem("limo-admin", "1"); } catch (er) {} show(); render(); ev("admin_login"); });
$("#logout").addEventListener("click", () => { try { sessionStorage.removeItem("limo-admin"); } catch (e) {} show(); });
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => { t.hidden = true; }, 2600); }
function persist(){ if (!save()) { toast(tr("a_full")); return false; } return true; }
$(".atabs").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; TAB = b.dataset.t; history.replaceState(null, "", "#" + TAB); render(); });
if (/^#(kalendar|zahtjevi|klijenti|vozila|cijene)$/.test(location.hash)) TAB = location.hash.slice(1);

function row(c){
  return `<div class="arow"><div class="pic${c.cat === "limo" ? " dk" : ""}">${carPic(c)}</div>
    <div><b>${escH(c.name)} <small>${c.year || ""}</small></b><small>${eur(c.price)} ${tr(c.cat === "limo" ? "per_hour" : "per_day")} · ${c.cat === "limo" ? tr("pax_n", { n: c.seats }) : tr("seats", { n: c.seats })}</small></div>
    <div class="ab"><label class="sw"><input type="checkbox" data-vis="${c.id}"${c.visible !== false ? " checked" : ""}>${tr(c.visible !== false ? "a_on" : "a_off")}</label>
      <button type="button" class="btn line sm" data-edit="${c.id}">${tr("a_edit")}</button><button type="button" class="btn line sm" data-del="${c.id}">${tr("a_del")}</button></div></div>`;
}
function pCars(){
  const g = cat => DB.cars.filter(c => c.cat === cat);
  $("#p-vozila").innerHTML = `<button type="button" class="btn gold" data-edit="new">+ ${tr("a_add")}</button>
    <p class="agrp">${tr("a_limo_list")}</p>${g("limo").map(row).join("") || `<p class="mut">${tr("no_cars")}</p>`}
    <p class="agrp">${tr("a_rent_list")}</p>${g("rent").map(row).join("") || `<p class="mut">${tr("no_cars")}</p>`}`;
}
$("#p-vozila").addEventListener("change", e => { const v = e.target.closest("[data-vis]"); if (!v) return; byId(v.dataset.vis).visible = v.checked; if (persist()) toast(tr("a_saved")); pCars(); });
$("#p-vozila").addEventListener("click", e => {
  const ed = e.target.closest("[data-edit]"); if (ed) { openForm(ed.dataset.edit); return; }
  const d = e.target.closest("[data-del]");
  if (d) { const c = byId(d.dataset.del); if (confirm(tr("a_del_q", { n: c.name }))) { DB.cars = DB.cars.filter(x => x !== c); persist(); render(); toast(tr("a_saved")); } }
});

/* add / edit form */
let F = null;
function openForm(id){
  const c = id === "new" ? null : byId(id);
  F = c ? JSON.parse(JSON.stringify(c)) : { id: null, cat: "rent", name: "", year: new Date().getFullYear(), body: "sedan", color: "#2B2F36", seats: 5, bags: 2, gear: "A", fuel: "D", price: "", desc: { me: "", en: "", ru: "", de: "" }, photos: [], busy: [], visible: true, test: false };
  F.err = ""; renderForm(); openSheet("carform");
}
function renderForm(){
  $("#carform-t").textContent = tr(F.id ? "a_edit_t" : "a_new_t");
  const f = (k, inner) => `<label class="fld"><span>${tr(k)}</span>${inner}</label>`, limo = F.cat === "limo";
  const sel = (key, opts) => `<select class="inp" data-f="${key}">${opts.map(([v, t]) => `<option value="${v}"${String(F[key]) === String(v) ? " selected" : ""}>${escH(t)}</option>`).join("")}</select>`;
  $("#cf-body").innerHTML = `<p class="h3">${tr("a_cat")}</p>
    <div class="radios"><label><input type="radio" name="cat" value="limo"${limo ? " checked" : ""}>${tr("nav_limo")}</label><label><input type="radio" name="cat" value="rent"${!limo ? " checked" : ""}>${tr("nav_rent")}</label></div>
    <div class="fg" style="--c:2;margin-top:14px">${f("a_name", `<input class="inp" data-f="name" value="${escH(F.name)}" placeholder="Mercedes-Benz E-Klasa">`)}${f("a_year", `<input class="inp" type="number" inputmode="numeric" data-f="year" value="${escH(F.year)}">`)}
      ${f(limo ? "a_price_hour" : "a_price_day", `<input class="inp" type="number" inputmode="decimal" min="0" data-f="price" value="${escH(F.price)}">${limo ? `<small class="small">${tr("a_price_hint")}</small>` : ""}`)}
      ${f(limo ? "a_pax" : "a_seats", sel("seats", [1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => [n, n])))}
      ${limo ? f("a_bags", sel("bags", [1, 2, 3, 4, 5, 6, 7, 8].map(n => [n, n]))) : f("a_gear", sel("gear", [["A", tr("gear_A")], ["M", tr("gear_M")]])) + f("a_fuel", sel("fuel", ["D", "P", "H", "E"].map(x => [x, tr("fuel_" + x)])))}</div>
    <div class="fg" style="--c:2;margin-top:10px">${LANGS.map(l => f("a_desc_" + l, `<textarea class="inp" data-d="${l}">${escH(F.desc[l] || "")}</textarea>`)).join("")}</div>
    <p class="small" style="margin-top:6px">${tr("a_desc_hint")}</p>
    <p class="h3">${tr("a_photos")}</p><p class="small" style="margin:-4px 0 10px">${tr("a_photos_hint")}</p>
    <div class="ph">${F.photos.map((p, i) => `<div><img src="${p}" alt=""><button type="button" data-rmph="${i}" aria-label="${tr("a_del")}">×</button></div>`).join("")}</div>
    ${F.photos.length < 4 ? `<label class="filebtn" style="margin-top:10px">${icon("cam")}<span>${tr("a_photo_btn")}</span><input type="file" accept="image/*" multiple id="cf-file"></label>` : ""}
    <div class="fg" style="--c:2;margin-top:14px">${f("a_body", sel("body", ["sedan", "suv", "van", "hatch"].map(x => [x, tr("body_" + x)])))}${f("a_color", `<input class="inp" type="color" data-f="color" value="${F.color}" style="padding:4px">`)}</div>
    <div class="pic${limo ? " dk" : ""}" style="border-radius:14px;margin-top:10px;max-width:420px">${carPic(F)}</div>
    <label class="sw" style="margin-top:16px"><input type="checkbox" data-f="visible"${F.visible !== false ? " checked" : ""}>${tr("a_visible")}</label>`;
  $("#cf-foot").innerHTML = `${F.err ? `<p class="err">${escH(F.err)}</p>` : ""}<div style="display:grid;grid-template-columns:1fr 2fr;gap:8px"><button type="button" class="btn line" data-close>${tr("a_cancel")}</button><button type="button" class="btn" id="cf-save">${tr("a_save")}</button></div>`;
  $("#cf-save").onclick = saveForm;
  const fi = $("#cf-file"); if (fi) fi.onchange = addPhotos;
}
$("#cf-body").addEventListener("input", e => {
  const t = e.target;
  if (t.name === "cat") { F.cat = t.value; renderForm(); return; }
  if (t.dataset.d) { F.desc[t.dataset.d] = t.value; return; }
  const k = t.dataset.f; if (!k) return;
  F[k] = t.type === "checkbox" ? t.checked : t.value;
  if (k === "body" || k === "color") { const pic = $("#cf-body .pic"); if (pic) pic.innerHTML = carPic(F); }
});
$("#cf-body").addEventListener("click", e => { const r = e.target.closest("[data-rmph]"); if (r) { F.photos.splice(+r.dataset.rmph, 1); renderForm(); } });
function resizeImg(file, max){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), cv = document.createElement("canvas");
      cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k); cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL("image/jpeg", .78)); };
      im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}
async function addPhotos(e){
  for (const file of [...e.target.files].slice(0, 4 - F.photos.length)) { try { F.photos.push(await resizeImg(file, 1100)); } catch (er) {} }
  renderForm();
}
function saveForm(){
  F.name = String(F.name || "").trim(); F.price = Number(F.price);
  if (!F.name || !(F.price > 0)) { F.err = tr("a_err_name"); renderForm(); return; }
  const { err, ...car } = F; car.seats = +car.seats; car.bags = +car.bags; car.year = +car.year || "";
  const backup = JSON.stringify(DB.cars);
  if (car.id) DB.cars = DB.cars.map(c => c.id === car.id ? car : c); else { car.id = ++DB.seq; DB.cars.push(car); }
  if (!save()) { DB.cars = JSON.parse(backup); F.err = tr("a_full"); renderForm(); return; }
  closeSheet(); render(); toast(tr("a_saved"));
}

/* ---------- client types and their colours */
const CS = ["new", "reg", "vip", "regvip", "bad"];
const clientOf = r => r && DB.clients.find(c => c.id === r.client);
const clientReqs = c => DB.requests.filter(r => r.client === c.id);
const csOf = r => { const c = clientOf(r); return c ? c.status : "new"; };
const cbadge = st => `<span class="cbadge cs-${st}">${tr("cs_" + st)}</span>`;
const reqPrice = r => (r.type === "rent" ? r.total : r.est) || 0;
const ST = { new: "st_new", ok: "st_ok", no: "st_no" };
function nthOf(r){   // which booking of this client it is, counting from the first
  const c = clientOf(r); if (!c) return 1;
  const list = clientReqs(c).filter(x => x.status !== "no").sort((a, b) => (a.d1 + a.time).localeCompare(b.d1 + b.time));
  const i = list.indexOf(r); return i < 0 ? list.length + 1 : i + 1;
}
const nthText = n => n > 1 ? tr("bf_nth", { n }) : tr("bf_first");
function legend(){
  let open = true; try { open = localStorage.getItem("limo-legend") !== "0"; } catch (e) {}
  return `<details class="legend"${open ? " open" : ""}><summary>${tr("lg_t")}</summary>
    <p class="lgh">${tr("lg_clients")}</p>${CS.map(s => `<div class="lgr">${cbadge(s)}<span>${tr("csd_" + s)}</span></div>`).join("")}
    <p class="lgh">${tr("lg_booking")}</p>
    <div class="lgr"><i class="sw2 cs-reg"></i><span>${tr("lgx_ok")}</span></div>
    <div class="lgr"><i class="sw2 cs-reg nw"></i><span>${tr("lgx_new")}</span></div>
    <div class="lgr"><i class="sw2 sh"></i><span>${tr("lgx_shut")}</span></div></details>`;
}
document.addEventListener("toggle", e => { if (e.target.classList && e.target.classList.contains("legend")) { try { localStorage.setItem("limo-legend", e.target.open ? "1" : "0"); } catch (er) {} } }, true);
function swapSheet(id){ if (openId) $("#" + openId).hidden = true; openSheet(id); }   // one sheet to another, one history entry
const showSheet = id => (openId ? swapSheet : openSheet)(id);

/* ---------- booking calendar: every car by day, limo and rent together */
const DAYS = 14;
let BSTART = 0, BFIL = "all";
function bookingOn(c, s){
  let best = null;
  for (const r of DB.requests) {
    if (r.car !== c.id || r.status === "no" || s < r.d1 || s > (r.d2 || r.d1)) continue;
    if (r.status === "ok") return r;
    if (!best) best = r;
  }
  return best;
}
const wd = s => WD[lang][(fromIso(s).getDay() + 6) % 7];
const fmtR = (a, z) => { const x = fromIso(a), y = fromIso(z); return x.getMonth() === y.getMonth() ? `${x.getDate()}.–${fmtD(z)}` : `${fmtD(a)}–${fmtD(z)}`; };
const dayLabel = s => s === TODAY_S ? tr("b_today") : s === iso(addD(TODAY, 1)) ? tr("tomorrow") : `${wd(s)} ${fmtD(s)}`;
function agenda(){
  const end = iso(addD(TODAY, 6)), ev = [], inW = s => s && s >= TODAY_S && s <= end;
  for (const r of DB.requests) {
    if (r.status === "no") continue;
    const c = byId(r.car), nm = c ? c.name : r.carName;
    if (r.type === "limo") { if (inW(r.d1)) ev.push({ d: r.d1, k: "ev_ride", r, nm, what: r.mode === "transfer" ? `${placeL(r.p1)} → ${placeL(r.p2)}` : `${tr("t_hourly")} ${r.hours} ${tr("h_short")} · ${placeL(r.p1)}` }); }
    else {
      if (inW(r.d1)) ev.push({ d: r.d1, k: "ev_pick", r, nm, what: placeName(r.place) });
      if (inW(r.d2)) ev.push({ d: r.d2, k: "ev_ret", r, nm, what: placeName(r.place) });
    }
  }
  ev.sort((a, b) => (a.d + a.r.time).localeCompare(b.d + b.r.time));
  if (!ev.length) return `<p class="mut">${tr("ag_empty")}</p>`;

function conflictFor(b){   // confirmed bookings and closed days of the same car that overlap
  const c = byId(b.car); if (!c) return false;
  const z = b.d2 || b.d1, m = manualSet(c);
  for (let d = fromIso(b.d1); iso(d) <= z; d = addD(d, 1)) if (m.has(iso(d))) return true;
  return DB.requests.some(r => r.id !== b.id && r.car === b.car && r.status === "ok" && !(r.d1 > z || (r.d2 || r.d1) < b.d1));
}
function saveBk(){

  b.name = String(b.name || "").trim(); b.phone = String(b.phone || "").trim();
  if (!b.name || !b.phone || !b.d1 || !b.time) { b.err = tr("bf_err"); renderBk(); return; }
  if (b.type === "rent" && !(b.d2 > b.d1)) { b.err = tr("bf_err_dates"); renderBk(); return; }
  b.car = +b.car; b.hours = +b.hours || 0; b.pax = +b.pax || 1;
  if (b.type === "rent") { b.days = nDays(b.d1, b.d2); b.total = +b.total || 0; } else { b.d2 = null; b.est = +b.est || 0; if (b.mode !== "transfer") b.p2 = ""; }
  if (b.status === "ok" && conflictFor(b)) { b.err = tr("bf_conflict"); renderBk(); return; }
  const { err, manualPrice, ...r } = b, car = byId(r.car), backup = JSON.stringify(DB);
  r.carName = car ? car.name : r.carName;

  else { r.id = ++DB.seq; r.created = TODAY_S; DB.requests.unshift(r); linkClient(r); }
  if (!save()) { DB = JSON.parse(backup); b.err = tr("a_full"); renderBk(); return; }
  closeSheet(); render(); toast(tr("a_saved"));

    <div class="fg two">${f("f_name", inp("name"))}${f("f_phone_s", inp("phone", "tel"))}${f("f_email", inp("email", "email"), 1)}
      ${f("cl_note", `<textarea class="inp" data-c="note" placeholder="${escH(tr("cl_ph_note"))}">${escH(c.note || "")}</textarea>`, 1)}</div>
    ${c.id ? `<p class="h3" style="margin-top:18px">${tr("cl_hist")}: ${s.n}${s.sum ? " · " + eur(s.sum) : ""}</p>` + hist.map(r => `<button type="button" class="agi cs-${c.status}" data-r="${r.id}"><span class="agt">${fmtD(r.d1)}</span>
      <span class="agx"><b>${tr(r.type === "rent" ? "nav_rent" : "nav_limo")} · ${escH((byId(r.car) || {}).name || r.carName)}</b><small>${escH(reqLines(r)[1])}</small>${r.comment ? `<small>${escH(r.comment)}</small>` : ""}</span>
      <span class="tags"><span class="st ${r.status}">${tr(ST[r.status])}</span></span></button>`).join("") : ""}`;
  $("#cl-foot").innerHTML = `${c.err ? `<p class="err">${escH(c.err)}</p>` : ""}<div class="fbtns"><button type="button" class="btn line" data-close>${tr("a_cancel")}</button><button type="button" class="btn" id="cl-save">${tr("a_save")}</button></div>`;
  $("#cl-save").onclick = saveCl;
}
$("#cl-body").addEventListener("input", e => {
  const t = e.target;
  if (t.name === "clst") { CL.status = t.value; renderCl(); return; }
  if (t.dataset.c) CL[t.dataset.c] = t.value;
});
$("#cl-body").addEventListener("click", e => { const r = e.target.closest("[data-r]"); if (r) openBk(r.dataset.r); });
function saveCl(){
  const c = CL; c.name = String(c.name || "").trim(); c.phone = String(c.phone || "").trim();
  if (!c.name || !c.phone) { c.err = tr("cl_err"); renderCl(); return; }
  if (DB.clients.some(x => x.id !== c.id && normTel(x.phone) === normTel(c.phone))) { c.err = tr("cl_exists"); renderCl(); return; }
  const { err, ...rec } = c;
  if (rec.id) Object.assign(DB.clients.find(x => x.id === rec.id), rec); else { rec.id = ++DB.seq; DB.clients.push(rec); }
  if (!persist()) return;
  closeSheet(); render(); toast(tr("a_saved"));
}

/* ---------- transfer prices: route x car, edited by the owner */
const PA = { a: "tgd", b: "bud", err: "" };
const short = n => { const w = String(n).split(" "); return w.length > 1 ? w.slice(1).join(" ") : n; };
function pPrices(){
  const cars = DB.cars.filter(c => c.cat === "limo"), pl = PLACES_L.filter(p => p[0] !== "oth");
  const num = (attr, v, label) => `<input class="inp pi" type="number" inputmode="numeric" min="0" step="5" ${attr} value="${v === "" || v == null ? "" : +v}" placeholder="–" aria-label="${escH(label)}">`;
  $("#p-cijene").innerHTML = `<p class="h3">${tr("pr_t")}</p><p class="small">${tr("pr_hint")}</p>
    <div class="ptw"><table class="ptab"><thead><tr><th>${tr("pr_route")}</th>${cars.map(c => `<th title="${escH(c.name)}">${escH(short(c.name))}</th>`).join("")}</tr></thead><tbody>
      <tr class="hr"><th>${tr("pr_hourly")}</th>${cars.map(c => `<td>${num(`data-hcar="${c.id}"`, c.price, c.name)}</td>`).join("")}</tr>
      ${DB.routes.map(r => `<tr><th><div class="rt"><span>${escH(placeL(r.a))}<br>→ ${escH(placeL(r.b))}</span><button type="button" class="pdel" data-delr="${r.id}" aria-label="${escH(tr("a_del"))}">×</button></div></th>${cars.map(c => `<td>${num(`data-r="${r.id}" data-c="${c.id}"`, r.p[c.id], `${placeL(r.a)} → ${placeL(r.b)}, ${c.name}`)}</td>`).join("")}</tr>`).join("")}
    </tbody></table></div>
    <div class="padd"><p class="h3">${tr("pr_add")}</p><div class="fg two"><label class="fld"><span>${tr("f_from")}</span><select class="inp" id="pr-a">${plOpts(PA.a, pl).replace(/^<option value="">[^<]*<\/option>/, "")}</select></label>
      <label class="fld"><span>${tr("f_to")}</span><select class="inp" id="pr-b">${plOpts(PA.b, pl).replace(/^<option value="">[^<]*<\/option>/, "")}</select></label></div>
      ${PA.err ? `<p class="err" style="margin-top:8px">${escH(PA.err)}</p>` : ""}<button type="button" class="btn line" id="pr-add">+ ${tr("pr_add")}</button></div>`;
}
$("#p-cijene").addEventListener("input", e => {
  const t = e.target, v = t.value === "" ? "" : Math.max(0, +t.value || 0);
  if (t.dataset.r) { const r = DB.routes.find(x => x.id === +t.dataset.r); if (r) { r.p[t.dataset.c] = v; save(); } }
  else if (t.dataset.hcar) { const c = byId(t.dataset.hcar); if (c) { c.price = +v || 0; save(); } }
  else if (t.id === "pr-a") PA.a = t.value; else if (t.id === "pr-b") PA.b = t.value;
});
$("#p-cijene").addEventListener("change", e => { if (e.target.dataset.r || e.target.dataset.hcar) { if (persist()) toast(tr("a_saved")); } });
$("#p-cijene").addEventListener("click", e => {
  const d = e.target.closest("[data-delr]");
  if (d) { if (!confirm(tr("pr_del_q"))) return; DB.routes = DB.routes.filter(r => r.id !== +d.dataset.delr); if (persist()) toast(tr("a_saved")); pPrices(); return; }
  if (e.target.closest("#pr-add")) {
    PA.err = PA.a === PA.b ? tr("pr_same") : routeOf(PA.a, PA.b) ? tr("pr_exists") : "";
    if (!PA.err) { DB.routes.push({ id: ++DB.seq, a: PA.a, b: PA.b, p: {} }); if (persist()) toast(tr("a_saved")); }
    pPrices();
    if (!PA.err) { const rows = $$("#p-cijene tbody tr"), i = rows.length && rows[rows.length - 1].querySelector("input"); if (i) { i.scrollIntoView({ block: "center" }); i.focus({ preventScroll: true }); } }
  }
});

$("#reset").addEventListener("click", () => { if (!confirm(tr("a_reset_q"))) return; try { localStorage.removeItem(KEY); } catch (e) {} load(); render(); toast(tr("a_saved")); });

function render(){
  show();
  if (!signed()) return;
  $$(".atabs [data-t]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === TAB)));
  ["kalendar", "zahtjevi", "klijenti", "vozila", "cijene"].forEach(t => { $("#p-" + t).hidden = t !== TAB; });
  const n = DB.requests.filter(r => r.status === "new").length; $("#req-n").textContent = n; $("#req-n").hidden = !n;
  if (TAB === "kalendar") keepScroll(pBoard); else if (TAB === "zahtjevi") pReq(); else if (TAB === "klijenti") pClients(); else if (TAB === "cijene") pPrices(); else pCars();
  if (openId === "carform" && F) renderForm();
  if (openId === "reqsheet" && BK) renderBk();
  if (openId === "clsheet" && CL) renderCl();
}

startLang();
</script>
</body>
</html>
